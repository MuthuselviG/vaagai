// ── Report Bottom Sheet ────────────────────────────────
function ReportSheet({ lang, onClose }) {
  const [selected, setSelected] = React.useState(null);
  const [submitted, setSubmitted] = React.useState(false);
  const options = REPORT_OPTIONS[lang];

  const handleSubmit = () => {
    if (!selected && selected !== 0) return;
    setSubmitted(true);
    setTimeout(onClose, 1200);
  };

  return (
    <>
      {/* Overlay */}
      <div onClick={onClose} style={{
        position: 'fixed', inset: 0, background: 'rgba(26,26,46,0.55)',
        zIndex: 40, animation: 'fadeIn 0.25s ease',
      }}/>
      {/* Sheet */}
      <div style={{
        position: 'fixed', bottom: 0, left: '50%', transform: 'translateX(-50%)',
        width: 390, background: T.surface,
        borderRadius: '20px 20px 0 0',
        zIndex: 50, animation: 'slideUp 0.35s cubic-bezier(0.32,0.72,0,1)',
        paddingBottom: 32,
        boxShadow: '0 -8px 40px rgba(0,0,0,0.15)',
      }}>
        {/* Drag handle */}
        <div style={{ display: 'flex', justifyContent: 'center', padding: '12px 0 4px' }}>
          <div style={{ width: 36, height: 4, borderRadius: 2, background: T.border }}/>

          display: 'flex', alignItems: 'center', justifyContent: 'space-between',

          borderBottom: `1px solid ${T.border}`,

          <div>
            <div style={{ color: T.text, fontSize: 15, fontWeight: 700 }}>
              {lang === 'ta' ? 'கேள்வி புகாரளி' : 'Report Question'}
            </div>
            <div style={{ color: T.textTer, fontSize: 12, marginTop: 2 }}>
              {lang === 'ta' ? 'காரணத்தைத் தேர்ந்தெடுக்கவும்' : 'Select a reason'}
            </div>
          </div>
          <button onClick={onClose} style={{
            width: 32, height: 32, borderRadius: 10, border: `1px solid ${T.border}`,
            background: T.bg, display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer',
          }}>
            <CloseIcon />
          </button>
        </div>

        {submitted ? (
          <div style={{ padding: '40px 20px', textAlign: 'center', animation: 'fadeUp 0.3s ease' }}>
            <div style={{
              width: 56, height: 56, borderRadius: '50%', background: '#E8F8F0',
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              margin: '0 auto 14px',
            }}>
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
                <path d="M5 12l5 5L20 7" stroke={T.green} strokeWidth="2.5" strokeLinecap="round"/>
              </svg>
            </div>
            <div style={{ color: T.text, fontSize: 15, fontWeight: 700 }}>
              {lang === 'ta' ? 'புகார் அனுப்பப்பட்டது!' : 'Report Submitted!'}
            </div>
            <div style={{ color: T.textSec, fontSize: 13, marginTop: 4 }}>
              {lang === 'ta' ? 'நன்றி, விரைவில் சரிசெய்கிறோம்.' : 'Thanks, we\'ll review it soon.'}
            </div>
          </div>
        ) : (
          <>
            {/* Options */}
            <div style={{ padding: '8px 0' }}>
              {options.map((opt, i) => (
                <div key={i} onClick={() => setSelected(i)} style={{

                  padding: '14px 20px', cursor: 'pointer',

                  borderLeft: selected === i ? `3px solid ${T.indigo}` : '3px solid transparent',
                  transition: 'all 0.15s ease',
                }}>
                  {/* Radio */}
                  <div style={{
                    width: 20, height: 20, borderRadius: '50%', flexShrink: 0,
                    border: `2px solid ${selected === i ? T.indigo : T.border}`,
                    background: selected === i ? T.indigo : 'transparent',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    transition: 'all 0.15s ease',
                  }}>
                    {selected === i && <div style={{ width: 7, height: 7, borderRadius: '50%', background: '#fff' }}/>}
                  </div>
                  <span style={{
                    fontSize: 14, fontWeight: selected === i ? 600 : 500,
                    color: selected === i ? T.indigo : T.text,
                    fontFamily: lang === 'ta' ? 'Noto Sans Tamil, Inter, sans-serif' : 'Inter, sans-serif',

              </button>
            </div>
          </>
        )}
      </div>
    </>

}

// ── Main Practice Screen ───────────────────────────────
function PracticeScreen() {
  const [lang, setLang] = React.useState('ta');
  const [curIdx, setCurIdx] = React.useState(0);
  const [answers, setAnswers] = React.useState({}); // { qIdx: 'a'|'b'|'c'|'d' }
  const [selected, setSelected] = React.useState(null);
  const [revealed, setRevealed] = React.useState(false);
  const [reportOpen, setReportOpen] = React.useState(false);
  const [wrongShake, setWrongShake] = React.useState(null);
  const pillRowRef = React.useRef(null);
  const total = QUESTIONS.length;
  const q = QUESTIONS[curIdx];

  // Scroll current pill into view
  React.useEffect(() => {
    const row = pillRowRef.current;
    if (!row) return;
    const pill = row.children[curIdx];
    if (pill) {
      const rowLeft = row.scrollLeft;
      const rowRight = rowLeft + row.clientWidth;
      const pillLeft = pill.offsetLeft;
      const pillRight = pillLeft + pill.offsetWidth;
      if (pillLeft < rowLeft + 20 || pillRight > rowRight - 20) {
        row.scrollTo({ left: pillLeft - row.clientWidth / 2 + pill.offsetWidth / 2, behavior: 'smooth' });
      }
    }
  }, [curIdx]);

  const handleSelect = (id) => {
    if (revealed) return;
    setSelected(id);
    setRevealed(true);
    setAnswers(a => ({ ...a, [curIdx]: id }));
    if (id !== q.correct) {
      setWrongShake(id);
      setTimeout(() => setWrongShake(null), 500);
    }
  };

  const handleNext = () => {
    if (curIdx < total - 1) {
      setCurIdx(i => i + 1);
      const nextIdx = curIdx + 1;
      const prevAnswer = answers[nextIdx];
      setSelected(prevAnswer || null);
      setRevealed(!!prevAnswer);
    }
  };

  const handlePillJump = (idx) => {
    setCurIdx(idx);
    const prevAnswer = answers[idx];
    setSelected(prevAnswer || null);
    setRevealed(!!prevAnswer);
  };

  const optState = (id) => {
    if (!revealed) return 'idle';
    if (id === q.correct) return 'correct';
    if (id === selected) return 'wrong';
    return 'idle';
  };

  const pillState = (i) => {
    if (i === curIdx) return 'current';
    if (answers[i]) return answers[i] === QUESTIONS[i].correct ? 'correct' : 'wrong';
    return 'unanswered';
  };

  return (
    <div style={{
      width: 390, background: T.bg,
      borderRadius: 40,
      boxShadow: '0 2px 4px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.08), 0 32px 64px rgba(0,0,0,0.1)',
      overflow: 'hidden', position: 'relative',
      minHeight: 780, display: 'flex', flexDirection: 'column',
      fontFamily: 'Inter, sans-serif',
    }}>

      {/* ── Top bar ────────────────────────────── */}
      <div style={{
        background: T.surface, borderBottom: `1px solid ${T.border}`,
        padding: '18px 16px 14px',
      }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button style={{
            width: 38, height: 38, borderRadius: 11,
            background: T.bg, border: `1px solid ${T.border}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', flexShrink: 0,
          }}><BackIcon /></button>

          <div style={{ flex: 1, textAlign: 'center' }}>
            <div style={{
              color: T.text, fontSize: 13, fontWeight: 700,
              fontFamily: lang === 'ta' ? 'Noto Sans Tamil, Inter' : 'Inter',
            }}>
              {lang === 'ta' ? 'பழைய தமிழ் வரலாறு' : 'Ancient Tamil History'}
            </div>
            <div style={{ color: T.textTer, fontSize: 11, marginTop: 1 }}>
              {lang === 'ta' ? 'அத்தியாயம் 1' : 'Chapter 1'}
            </div>
          </div>

          {/* Lang toggle */}
          <div style={{
            display: 'flex', alignItems: 'center',
            background: T.bg, border: `1px solid ${T.border}`,
            borderRadius: 20, padding: 3,
          }}>
            {[['ta','தமிழ்'],['en','EN']].map(([v,l]) => (
              <button key={v} onClick={() => setLang(v)} style={{
                border: 'none', cursor: 'pointer',
                background: lang === v ? T.indigo : 'transparent',
                color: lang === v ? '#fff' : T.textSec,
                padding: '4px 9px', borderRadius: 16,
                fontSize: v === 'ta' ? 11 : 11, fontWeight: 700,
                fontFamily: v === 'ta' ? 'Noto Sans Tamil, Inter' : 'Inter',
                transition: 'all 0.18s ease',
              }}>{l}</button>
            ))}
          </div>
        </div>

        {/* Progress */}
        <div style={{ marginTop: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
            <span style={{ color: T.text, fontSize: 13, fontWeight: 700 }}>
              {lang === 'ta' ? `கேள்வி ${curIdx + 1}` : `Question ${curIdx + 1}`}
              <span style={{ color: T.textSec, fontWeight: 500 }}>
                {lang === 'ta' ? ` / ${total}` : ` of ${total}`}
              </span>
            </span>
            <span style={{ color: T.textTer, fontSize: 12, fontWeight: 600 }}>
              {total - curIdx - 1} {lang === 'ta' ? 'மீதம்' : 'left'}
            </span>
          </div>
          <div style={{ height: 4, background: T.border, borderRadius: 2, overflow: 'hidden' }}>
            <div style={{
              width: `${(curIdx / total) * 100}%`, height: '100%',
              background: `linear-gradient(90deg, ${T.indigo}, #6274CC)`,
              borderRadius: 2, transition: 'width 0.4s cubic-bezier(0.4,0,0.2,1)',
            }}/>
          </div>
        </div>

        {/* Pill nav */}
        <div ref={pillRowRef} style={{
          display: 'flex', gap: 6, marginTop: 12, overflowX: 'auto',
          paddingBottom: 2, msOverflowStyle: 'none', scrollbarWidth: 'none',
        }} className="scroll-hide">
          {QUESTIONS.map((_, i) => {
            const ps = pillState(i);
            return (
              <button key={i} onClick={() => handlePillJump(i)} style={{
                width: 30, height: 30, borderRadius: 9, flexShrink: 0,
                border: ps === 'current'  ? `2px solid ${T.indigo}`
                      : ps === 'correct'  ? `1.5px solid ${T.greenBorder}`
                      : ps === 'wrong'    ? `1.5px solid ${T.redBorder}`
                      : `1.5px solid ${T.border}`,
                background: ps === 'current' ? T.indigoLight
                          : ps === 'correct' ? T.greenBg
                          : ps === 'wrong'   ? T.redBg
                          : T.surface,
                color: ps === 'current' ? T.indigo
                     : ps === 'correct' ? T.green
                     : ps === 'wrong'   ? T.red
                     : T.textTer,
                fontSize: 11, fontWeight: 700, cursor: 'pointer',
                transition: 'all 0.2s ease',
                boxShadow: ps === 'current' ? `0 2px 8px rgba(61,82,160,0.25)` : 'none',
              }}>
                {ps === 'correct' ? '✓' : ps === 'wrong' ? '✗' : i + 1}
              </button>
            );
          })}
        </div>
      </div>

      {/* ── Scrollable content ──────────────────── */}
      <div className="scroll-hide" style={{ flex: 1, overflowY: 'auto', padding: '14px 14px 0' }}>

        {/* Question card */}
        <div style={{
          background: T.surface, border: `1px solid ${T.border}`,
          borderRadius: 18, padding: '18px 16px', marginBottom: 12,
          boxShadow: '0 1px 3px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.05)',
          position: 'relative',
        }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-start', marginBottom: 12 }}>
            <div style={{
              display: 'inline-flex', alignItems: 'center', gap: 5,
              background: T.indigoLight, borderRadius: 8, padding: '3px 10px',
            }}>
              <div style={{ width: 5, height: 5, borderRadius: '50%', background: T.indigo }}/>
              <span style={{
                color: T.indigo, fontSize: 10, fontWeight: 800, letterSpacing: 0.7,
                fontFamily: lang === 'ta' ? 'Noto Sans Tamil, Inter' : 'Inter',
              }}>
                {q.subject[lang]}
              </span>
            </div>
            {/* Flag button */}
            <button onClick={() => setReportOpen(true)} style={{
              width: 32, height: 32, borderRadius: 9,
              background: T.bg, border: `1px solid ${T.border}`,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              cursor: 'pointer', transition: 'all 0.15s',
              flexShrink: 0,
            }}
            onMouseEnter={e => { e.currentTarget.style.borderColor = '#F5BFBB'; e.currentTarget.style.background = T.redBg; }}
            onMouseLeave={e => { e.currentTarget.style.borderColor = T.border; e.currentTarget.style.background = T.bg; }}
            >
              <FlagIcon color={T.textTer} />
            </button>
          </div>
          <p style={{
            color: T.text, fontSize: 15, fontWeight: 600,
            lineHeight: 1.65, letterSpacing: -0.15,
            fontFamily: lang === 'ta' ? 'Noto Sans Tamil, Inter' : 'Inter',
          }}>
            {q[lang]}
          </p>
        </div>

        {/* Options */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 9, marginBottom: 12 }}>
          {q.options.map((opt, i) => {
            const st = optState(opt.id);
            const labels = ['A','B','C','D'];
            const isShaking = wrongShake === opt.id;

            let bg = T.surface, border = T.border, textColor = T.text;
            let badgeBg = T.bg, badgeColor = T.textSec, bdr = 'none';
            if (st === 'correct') {
              bg = T.greenBg; border = T.greenBorder; textColor = T.green;
              badgeBg = T.green; bdr = 'none';
            } else if (st === 'wrong') {
              bg = T.redBg; border = T.redBorder; textColor = T.red;
              badgeBg = T.red;
            }

            return (
              <button key={opt.id} onClick={() => handleSelect(opt.id)} style={{
                width: '100%', background: bg,
                border: `1.5px solid ${border}`,
                borderRadius: 13, padding: '13px 14px',
                display: 'flex', alignItems: 'center', gap: 12,
                cursor: revealed ? 'default' : 'pointer',
                textAlign: 'left', minHeight: 54,
                boxShadow: st === 'correct' ? '0 2px 12px rgba(5,122,85,0.12)'
                         : st === 'wrong'   ? '0 2px 12px rgba(192,57,43,0.1)'
                         : '0 1px 3px rgba(0,0,0,0.05)',
                transition: 'all 0.22s ease',
                animation: isShaking ? 'shakeX 0.45s ease' : 'none',
              }}>
                <div style={{
                  width: 30, height: 30, borderRadius: 9, flexShrink: 0,
                  background: st !== 'idle' ? badgeBg : T.bg,
                  border: st === 'idle' ? `1.5px solid ${T.border}` : 'none',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                  transition: 'all 0.22s ease',
                }}>
                  {st === 'correct' ? <CheckIcon /> :
                   st === 'wrong'   ? <CrossIcon /> :
                   <span style={{ fontSize: 11, fontWeight: 700, color: T.textSec }}>{labels[i]}</span>}
                </div>
                <span style={{
                  fontSize: 13.5, fontWeight: st !== 'idle' ? 600 : 500,
                  color: textColor, lineHeight: 1.5, flex: 1,
                  fontFamily: lang === 'ta' ? 'Noto Sans Tamil, Inter' : 'Inter',
                  transition: 'color 0.2s ease',
                }}>
                  {opt[lang]}
                </span>
              </button>
            );
          })}
        </div>

        {/* Explanation */}
        {revealed && (
          <div style={{
            background: T.surface, border: `1px solid ${T.border}`,
            borderRadius: 13, padding: '12px 14px', marginBottom: 14,
            display: 'flex', gap: 10,
            boxShadow: '0 1px 3px rgba(0,0,0,0.04)',
            animation: 'fadeUp 0.3s ease',
          }}>
            <div style={{
              width: 26, height: 26, borderRadius: 8, background: T.indigoLight,
              display: 'flex', alignItems: 'center', justifyContent: 'center',
              flexShrink: 0, marginTop: 1,
            }}>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <circle cx="6.5" cy="6.5" r="5.8" stroke={T.indigo} strokeWidth="1.2"/>
                <path d="M6.5 5.5v4M6.5 4v.5" stroke={T.indigo} strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </div>
            <div>
              <div style={{ color: T.indigo, fontSize: 10, fontWeight: 800, letterSpacing: 0.5, marginBottom: 3 }}>
                {lang === 'ta' ? 'விளக்கம்' : 'EXPLANATION'}
              </div>
              <p style={{
                color: T.textSec, fontSize: 12.5, lineHeight: 1.6,
                fontFamily: lang === 'ta' ? 'Noto Sans Tamil, Inter' : 'Inter',
              }}>
                {q.explanation[lang]}
              </p>
            </div>
          </div>
        )}
      </div>

      {/* ── Next CTA ────────────────────────────── */}
      <div style={{
        padding: '12px 14px 28px', background: T.bg,
        borderTop: revealed ? `1px solid ${T.border}` : 'none',
        opacity: revealed ? 1 : 0,
        transform: revealed ? 'translateY(0)' : 'translateY(10px)',
        transition: 'all 0.3s cubic-bezier(0.4,0,0.2,1)',
        pointerEvents: revealed ? 'all' : 'none',
      }}>
        <button onClick={handleNext} style={{
          width: '100%', background: `linear-gradient(135deg, ${T.indigo}, #5062B8)`,
          border: 'none', borderRadius: 14, padding: '15px',
          color: '#fff', fontSize: 14, fontWeight: 700,
          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
          boxShadow: '0 4px 14px rgba(61,82,160,0.4)',
          fontFamily: lang === 'ta' ? 'Noto Sans Tamil, Inter' : 'Inter',
        }}>
          {curIdx < total - 1
            ? (lang === 'ta' ? 'அடுத்த கேள்வி' : 'Next Question')
            : (lang === 'ta' ? 'முடிவுகளை காண்க' : 'Finish & See Results')
          }
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <path d="M4 8.5H13M13 8.5L9 4.5M13 8.5L9 12.5" stroke="white" strokeWidth="1.8" strokeLinecap="round"/>
          </svg>
        </button>
      </div>

      {/* ── Report Sheet ─────────────────────────── */}
      {reportOpen && <ReportSheet lang={lang} onClose={() => setReportOpen(false)} />}
    </div>
  );
}

function App() {
  return (
    <>
      <style>{`
        button:focus { outline: none; }
        button:focus-visible { outline: 2px solid #3D52A0; outline-offset: 2px; }
        @keyframes fadeUp { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }
        @keyframes slideUp { from{transform:translateY(100%)} to{transform:translateY(0)} }
        @keyframes fadeIn  { from{opacity:0} to{opacity:1} }
        @keyframes shakeX {
          0%,100%{transform:translateX(0)} 20%{transform:translateX(-5px)}
          40%{transform:translateX(5px)} 60%{transform:translateX(-4px)} 80%{transform:translateX(4px)}
        }
      `}</style>
      <PracticeScreen />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
