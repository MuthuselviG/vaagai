<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TNPSC Practice App — All Screens</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Noto+Sans+Tamil:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #D8DCE8;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: 48px 32px 64px;
  }
  .scroll-hide::-webkit-scrollbar { display: none; }
  .scroll-hide { -ms-overflow-style: none; scrollbar-width: none; }
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes scaleIn {
    from { opacity: 0; transform: scale(0.95); }
    to   { opacity: 1; transform: scale(1); }
  }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

// ── Design Tokens ─────────────────────────────────────────
const T = {
  bg: '#F7F8FC',
  surface: '#FFFFFF',
  indigo: '#3D52A0',
  indigoDark: '#2D3E7A',
  indigoLight: '#EEF1FA',
  indigoMid: '#C5CEF0',
  text: '#1A1A2E',
  textSec: '#6B7280',
  textTer: '#9CA3AF',
  border: '#E4E7F0',
  green: '#057A55',
  greenBg: '#E8F8F0',
  greenBorder: '#A8DBBE',
  red: '#C0392B',
  redBg: '#FDECEC',
  redBorder: '#F5BFBB',
  whatsapp: '#25D366',
};

const shadow = {
  sm: '0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04)',
  md: '0 2px 8px rgba(0,0,0,0.07), 0 1px 3px rgba(0,0,0,0.05)',
  lg: '0 4px 16px rgba(0,0,0,0.08), 0 2px 6px rgba(0,0,0,0.05)',
  indigo: '0 4px 14px rgba(61,82,160,0.35), 0 1px 4px rgba(61,82,160,0.2)',
  green: '0 4px 14px rgba(5,122,85,0.3)',
};

// ── Shared: Lang Toggle ───────────────────────────────────
function LangToggle({ lang, setLang, style = {} }) {
  return (
    <div style={{
      display: 'flex', alignItems: 'center',
      background: T.surface, border: `1px solid ${T.border}`,
      borderRadius: 20, padding: 3,
      boxShadow: shadow.sm, flexShrink: 0, ...style,
    }}>
      {[['en','EN'],['ta','தமிழ்']].map(([v,l]) => (
        <button key={v} onClick={() => setLang(v)} style={{
          border: 'none', cursor: 'pointer',
          background: lang === v ? T.indigo : 'transparent',
          color: lang === v ? '#fff' : T.textSec,
          padding: '4px 10px', borderRadius: 16,
          fontSize: 11, fontWeight: 700,
          transition: 'all 0.18s ease',
          fontFamily: v === 'ta' ? 'Noto Sans Tamil, Inter, sans-serif' : 'Inter, sans-serif',
        }}>{l}</button>
      ))}
    </div>
  );
}

// ── Shared: Bottom Nav ────────────────────────────────────
function BottomNav({ active }) {
  const tabs = [
    { id: 'home', label: 'Home', path: 'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z' },
    { id: 'practice', label: 'Practice', cx: 12, cy: 12, r: 10, isCircle: true },
    { id: 'scores', label: 'Scores', isBar: true },
  ];
  const BarIcon = ({ active }) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={active ? T.indigo : T.textTer} strokeWidth="2" strokeLinecap="round">
      <line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>
    </svg>
  );
  const ClockIcon = ({ active }) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={active ? T.indigo : T.textTer} strokeWidth="2" strokeLinecap="round">
      <circle cx="12" cy="12" r="10"/><polyline points="12,6 12,12 16,14"/>
    </svg>
  );
  const HomeIcon = ({ active }) => (
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={active ? T.indigo : T.textTer} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/>
    </svg>
  );
  return (
    <div style={{
      display: 'flex', borderTop: `1px solid ${T.border}`,
      background: T.surface, paddingBottom: 24, paddingTop: 10,
    }}>
      {[
        { id: 'home', label: 'Home', Icon: HomeIcon },
        { id: 'practice', label: 'Practice', Icon: ClockIcon },
        { id: 'scores', label: 'Scores', Icon: BarIcon },
      ].map(({ id, label, Icon }) => {
        const isActive = id === active;
        return (
          <div key={id} style={{ flex: 1, display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 4, cursor: 'pointer' }}>
            <Icon active={isActive} />
            <span style={{ fontSize: 10, fontWeight: 600, color: isActive ? T.indigo : T.textTer, letterSpacing: 0.3 }}>{label}</span>
            {isActive && <div style={{ width: 4, height: 4, borderRadius: 2, background: T.indigo, marginTop: -2 }}/>}
          </div>
        );
      })}
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// SCREEN 1 — Landing
// ══════════════════════════════════════════════════════════
function Screen1() {
  return (
    <div style={{ background: T.bg, height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* Hero */}
      <div style={{
        flex: 1, display: 'flex', flexDirection: 'column',
        alignItems: 'center', justifyContent: 'flex-start',
        padding: '48px 24px 48px', textAlign: 'center',
        overflowY: 'auto',
      }}>
        {/* App badge */}
        <div style={{
          display: 'inline-flex', alignItems: 'center', gap: 8,
          background: T.indigoLight, border: `1px solid ${T.indigoMid}`,
          borderRadius: 20, padding: '6px 14px', marginBottom: 28,
        }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: T.indigo }}/>
          <span style={{ color: T.indigo, fontSize: 11, fontWeight: 700, letterSpacing: 0.8 }}>TNPSC EXAM PREP</span>
        </div>

        {/* App name */}
        <h1 style={{
          fontSize: 36, fontWeight: 900, color: T.text,
          letterSpacing: -1.2, lineHeight: 1.1, marginBottom: 14,
        }}>
          <span style={{ color: T.indigo }}>வாகை</span>
        </h1>
        <p style={{ color: T.textSec, fontSize: 14, fontWeight: 500, marginBottom: 32, lineHeight: 1.6 }}>
          Built for Tamil Nadu's future.
        </p>

        {/* CTA */}
        <button style={{
          width: '100%', background: `linear-gradient(135deg, ${T.indigo}, #5062B8)`,
          border: 'none', borderRadius: 16, padding: '17px',
          color: '#fff', fontSize: 16, fontWeight: 700,
          cursor: 'pointer', letterSpacing: -0.2,
          boxShadow: shadow.indigo, marginBottom: 16,
        }}>
          Start Practicing Free
        </button>
        <button style={{
          width: '100%', background: 'transparent',
          border: `1.5px solid ${T.border}`, borderRadius: 16, padding: '16px',
          color: T.textSec, fontSize: 15, fontWeight: 600,
          cursor: 'pointer',
        }}>
          Log In
        </button>

        {/* Feature pills */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, width: '100%', marginTop: 36 }}>
          {[
            { icon: '📚', text: '10,000+ Questions', sub: 'Curated by experts' },
            { icon: '✨', text: 'AI-powered Practice', sub: 'Personalised for you', indigo: true },
            { icon: '🎓', text: 'Class 6–10 Samacheer', sub: 'Full syllabus coverage' },
            { icon: '✅', text: 'TNPSC Group 4 Ready', sub: 'Updated 2024 syllabus' },
          ].map(f => (
            <div key={f.text} style={{
              background: f.indigo ? T.indigoLight : T.surface,
              border: `1px solid ${f.indigo ? T.indigoMid : T.border}`,
              borderRadius: 14, padding: '13px 16px',
              display: 'flex', alignItems: 'center', gap: 12,
              boxShadow: shadow.sm,
            }}>
              <div style={{
                width: 38, height: 38, borderRadius: 10,
                background: f.indigo ? T.indigo : T.indigoLight,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                fontSize: 18, flexShrink: 0,
              }}>{f.icon}</div>
              <div>
                <div style={{ color: f.indigo ? T.indigo : T.text, fontSize: 13, fontWeight: 700 }}>{f.text}</div>
                <div style={{ color: f.indigo ? T.indigoDark : T.textTer, fontSize: 11, fontWeight: 500, marginTop: 1 }}>{f.sub}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Pricing note */}
        <p style={{ color: T.textTer, fontSize: 12, marginTop: 22, lineHeight: 1.5, textAlign: 'center', width: '100%' }}>
          <span style={{ color: T.indigo, fontWeight: 600 }}>₹499/year</span> for full access
        </p>
      </div>
      <BottomNav active="home" />
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// SCREEN 2 — Subjects + Chapters
// ══════════════════════════════════════════════════════════
const subjectsData = [
  { id: 'history', en: 'History', ta: 'வரலாறு', icon: '📜', chapters: [
    { en: 'Ancient Tamil History', ta: 'பழைய தமிழ் வரலாறு', done: 3, total: 10 },
    { en: 'Medieval India', ta: 'இடைகால இந்தியா', done: 0, total: 12 },
    { en: 'Modern India', ta: 'நவீன இந்தியா', done: 7, total: 10 },
  ]},
  { id: 'geography', en: 'Geography', ta: 'புவியியல்', icon: '🗺️', chapters: [
    { en: 'Physical Geography', ta: 'இயற்கை புவியியல்', done: 5, total: 8 },
    { en: 'Tamil Nadu Districts', ta: 'மாவட்டங்கள்', done: 0, total: 6 },
  ]},
  { id: 'polity', en: 'Polity', ta: 'அரசியல்', icon: '⚖️', chapters: [
    { en: 'Indian Constitution', ta: 'அரசமைப்பு', done: 2, total: 10 },
    { en: 'Preamble & Rights', ta: 'முன்னுரை', done: 0, total: 8 },
  ]},
  { id: 'economy', en: 'Economy', ta: 'பொருளாதாரம்', icon: '💹', chapters: [
    { en: 'National Income', ta: 'தேசிய வருமானம்', done: 0, total: 7 },
  ]},
];

function Screen2() {
  const [lang, setLang] = React.useState('en');
  const [open, setOpen] = React.useState({ history: true });

  return (
    <div style={{ background: T.bg, height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* Top bar */}
      <div style={{ background: T.surface, borderBottom: `1px solid ${T.border}`, padding: '16px 18px' }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center' }}>
          <div style={{
            background: T.indigoLight, border: `1px solid ${T.indigoMid}`,
            borderRadius: 10, padding: '5px 12px',
            color: T.indigo, fontSize: 12, fontWeight: 800, letterSpacing: 0.3,
          }}>TNPSC GROUP 4</div>
          <LangToggle lang={lang} setLang={setLang} />
        </div>
        <h2 style={{ color: T.text, fontSize: 20, fontWeight: 800, marginTop: 14, letterSpacing: -0.4 }}>
          {lang === 'ta' ? 'பாடங்கள்' : 'Subjects'}
        </h2>
        <p style={{ color: T.textSec, fontSize: 12, marginTop: 2 }}>
          {lang === 'ta' ? '6 பாடங்கள் · 24 அத்தியாயங்கள்' : '6 subjects · 24 chapters'}
        </p>
      </div>

      {/* List */}
      <div className="scroll-hide" style={{ flex: 1, overflowY: 'auto', padding: '14px 16px 80px' }}>
        {subjectsData.map(sub => {
          const isOpen = open[sub.id];
          const totalDone = sub.chapters.reduce((s, c) => s + c.done, 0);
          const totalQ = sub.chapters.reduce((s, c) => s + c.total, 0);
          return (
            <div key={sub.id} style={{ marginBottom: 10 }}>
              <button onClick={() => setOpen(o => ({ ...o, [sub.id]: !o[sub.id] }))} style={{
                width: '100%', background: isOpen ? T.indigoLight : T.surface,
                border: `1.5px solid ${isOpen ? T.indigoMid : T.border}`,
                borderRadius: isOpen ? '14px 14px 0 0' : 14,
                padding: '13px 14px', cursor: 'pointer',
                display: 'flex', alignItems: 'center', gap: 10,
                boxShadow: isOpen ? 'none' : shadow.sm,
                transition: 'all 0.2s ease',
              }}>
                <span style={{ fontSize: 22, lineHeight: 1 }}>{sub.icon}</span>
                <div style={{ flex: 1, textAlign: 'left' }}>
                  <div style={{ color: T.text, fontWeight: 700, fontSize: 14 }}>
                    {lang === 'ta' ? sub.ta : sub.en}
                  </div>
                  <div style={{ color: T.textSec, fontSize: 11, marginTop: 1 }}>
                    {sub.chapters.length} chapters · {totalDone}/{totalQ} done
                  </div>
                </div>
                <div style={{
                  background: isOpen ? T.indigo : T.bg,
                  color: isOpen ? '#fff' : T.textSec,
                  borderRadius: 8, padding: '2px 8px',
                  fontSize: 11, fontWeight: 700, transition: 'all 0.2s',
                }}>
                  {sub.chapters.length}
                </div>
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style={{ transition: 'transform 0.2s', transform: isOpen ? 'rotate(180deg)' : 'none' }}>
                  <path d="M4 6l4 4 4-4" stroke={isOpen ? T.indigo : T.textSec} strokeWidth="2" strokeLinecap="round"/>
                </svg>
              </button>

              {isOpen && (
                <div style={{
                  background: T.surface,
                  border: `1.5px solid ${T.indigoMid}`,
                  borderTop: 'none', borderRadius: '0 0 14px 14px',
                  overflow: 'hidden',
                }}>
                  {sub.chapters.map((ch, i) => (
                    <div key={i} style={{
                      display: 'flex', alignItems: 'center', gap: 12,
                      padding: '12px 14px',
                      borderTop: i > 0 ? `1px solid ${T.border}` : 'none',
                    }}>
                      <div style={{ flex: 1 }}>
                        <div style={{ color: T.text, fontSize: 13, fontWeight: 600, lineHeight: 1.4 }}>
                          {lang === 'ta' ? ch.ta : ch.en}
                        </div>
                        {/* Mini progress */}
                        <div style={{ display: 'flex', alignItems: 'center', gap: 6, marginTop: 5 }}>
                          <div style={{ flex: 1, height: 3, background: T.border, borderRadius: 2, overflow: 'hidden' }}>
                            <div style={{
                              width: `${(ch.done / ch.total) * 100}%`, height: '100%',
                              background: ch.done > 0 ? T.green : T.border,
                              borderRadius: 2, transition: 'width 0.3s',
                            }}/>
                          </div>
                          <span style={{ color: T.textTer, fontSize: 10, fontWeight: 600, whiteSpace: 'nowrap' }}>
                            {ch.done}/{ch.total}
                          </span>
                        </div>
                      </div>
                      <button style={{
                        background: T.indigo, border: 'none', borderRadius: 10,
                        padding: '7px 14px', cursor: 'pointer',
                        color: '#fff', fontSize: 12, fontWeight: 700,
                        boxShadow: '0 2px 8px rgba(61,82,160,0.3)',
                        flexShrink: 0,
                      }}>
                        {lang === 'ta' ? 'தொடங்கு' : 'Start →'}
                      </button>
                    </div>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>
      <BottomNav active="practice" />
    </div>
  );
}

// ══════════════════════════════════════════════════════════
// SCREEN 3 — Practice / MCQ
// ══════════════════════════════════════════════════════════
const mcqQuestion = {
  text: "Which battle firmly established British supremacy in India and ended the influence of other European powers?",
  options: [
    { id: 'a', text: 'Battle of Plassey, 1757' },
    { id: 'b', text: 'Battle of Buxar, 1764' },
    { id: 'c', text: 'Battle of Wandiwash, 1760' },
    { id: 'd', text: 'Third Battle of Panipat, 1761' },
  ],
  correct: 'a',
  explanation: 'The Battle of Plassey (1757) gave Britain control of Bengal — the foundation of its Indian empire.',
};

function Screen3() {
  const [lang, setLang] = React.useState('en');
  const [selected, setSelected] = React.useState('c');
  const revealed = true;
  const curQ = 3;
  const total = 10;
  const answered = { 0: true, 1: true };
  const pillRowRef = React.useRef(null);

  const optState = (id) => {
    if (!revealed) return 'idle';
    if (id === mcqQuestion.correct) return 'correct';
    if (id === selected && id !== mcqQuestion.correct) return 'wrong';
    return 'idle';
  };

  return (
    <div style={{ background: T.bg, height: '100%', display: 'flex', flexDirection: 'column' }}>
      {/* Top bar */}
      <div style={{ background: T.surface, borderBottom: `1px solid ${T.border}`, padding: '14px 16px' }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 12 }}>
          <button style={{
            width: 38, height: 38, borderRadius: 11,
            background: T.bg, border: `1px solid ${T.border}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: 'pointer', flexShrink: 0,
          }}>
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none">
              <path d="M11 13.5L6.5 9 11 4.5" stroke={T.text} strokeWidth="2" strokeLinecap="round"/>
            </svg>
          </button>
          <div style={{ flex: 1, textAlign: 'center' }}>
            <div style={{ color: T.text, fontSize: 13, fontWeight: 700 }}>Ancient Tamil History</div>
            <div style={{ color: T.textSec, fontSize: 11, marginTop: 1 }}>Chapter 1</div>
          </div>
          <LangToggle lang={lang} setLang={setLang} />
        </div>

        {/* Progress */}
        <div style={{ marginTop: 14 }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
            <span style={{ color: T.text, fontSize: 13, fontWeight: 700 }}>Question {curQ} <span style={{ color: T.textSec, fontWeight: 500 }}>of {total}</span></span>
            <span style={{
              color: T.textTer, fontSize: 12, fontWeight: 500,
            }}>{total - curQ + 1} left</span>
          </div>
          <div style={{ height: 4, background: T.border, borderRadius: 2, overflow: 'hidden' }}>
            <div style={{
              width: `${(curQ - 1) / total * 100}%`, height: '100%',
              background: `linear-gradient(90deg, ${T.indigo}, #6274CC)`,
              borderRadius: 2,
            }}/>
          </div>
        </div>

        {/* Pill nav */}
        <div ref={pillRowRef} className="scroll-hide" style={{
          display: 'flex', gap: 6, marginTop: 12, overflowX: 'auto', paddingBottom: 2,
        }}>
          {Array.from({ length: total }, (_, i) => {
            const isCur = i + 1 === curQ;
            const isDone = answered[i] !== undefined;
            return (
              <div key={i} style={{
                width: 30, height: 30, borderRadius: 9, flexShrink: 0,
                border: isCur ? `2px solid ${T.indigo}` : `1.5px solid ${isDone ? '#C5CEF0' : T.border}`,
                background: isDone ? T.indigoLight : isCur ? 'transparent' : T.surface,
                display: 'flex', alignItems: 'center', justifyContent: 'center',
                cursor: 'pointer', position: 'relative',
              }}>
                <span style={{
                  fontSize: 11, fontWeight: 700,
                  color: isCur ? T.indigo : isDone ? T.indigo : T.textTer,
                }}>{i + 1}</span>
                {isDone && <div style={{
                  position: 'absolute', bottom: -2, right: -2,
                  width: 7, height: 7, borderRadius: '50%',
                  background: T.green, border: `1.5px solid ${T.bg}`,
                }}/>}
              </div>
            );
          })}
        </div>
      </div>

      {/* Scrollable content */}
      <div className="scroll-hide" style={{ flex: 1, overflowY: 'auto', padding: '14px 14px 0' }}>
        {/* Question */}
        <div style={{
          background: T.surface, border: `1px solid ${T.border}`,
          borderRadius: 18, padding: '20px 18px', marginBottom: 12,
          boxShadow: shadow.md,
        }}>
          <div style={{
            display: 'inline-flex', alignItems: 'center', gap: 5,
            background: T.indigoLight, borderRadius: 8, padding: '3px 10px', marginBottom: 12,
          }}>
            <div style={{ width: 5, height: 5, borderRadius: '50%', background: T.indigo }}/>
            <span style={{ color: T.indigo, fontSize: 10, fontWeight: 800, letterSpacing: 0.7 }}>HISTORY</span>
          </div>
          <p style={{ color: T.text, fontSize: 15, fontWeight: 600, lineHeight: 1.65, letterSpacing: -0.15 }}>
            {mcqQuestion.text}
          </p>
        </div>

        {/* Options */}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 12 }}>
          {mcqQuestion.options.map((opt, i) => {
            const st = optState(opt.id);
            const labels = ['A','B','C','D'];
            const styles = {
              correct: { bg: T.greenBg, border: T.greenBorder, text: T.green, badgeBg: T.green },
              wrong: { bg: T.redBg, border: T.redBorder, text: T.red, badgeBg: T.red },
              idle: { bg: T.surface, border: T.border, text: T.text, badgeBg: T.bg },
            };
            const s = styles[st];
            return (
              <button key={opt.id} onClick={() => !revealed && setSelected(opt.id)} style={{
                width: '100%', background: s.bg,
                border: `1.5px solid ${s.border}`,
                borderRadius: 13, padding: '13px 14px',
                display: 'flex', alignItems: 'center', gap: 12,
                cursor: 'pointer', textAlign: 'left', minHeight: 54,
                boxShadow: st === 'correct' ? '0 2px 12px rgba(5,122,85,0.12)'
                  : st === 'wrong' ? '0 2px 12px rgba(192,57,43,0.1)' : shadow.sm,
                transition: 'all 0.22s ease',
              }}>
                <div style={{
                  width: 30, height: 30, borderRadius: 9, flexShrink: 0,
                  background: st !== 'idle' ? s.badgeBg : T.surface,
                  border: st === 'idle' ? `1.5px solid ${T.border}` : 'none',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  {st === 'correct' ? (
                    <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                      <path d="M2 6.5L5 9.5L11 3.5" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                    </svg>
                  ) : st === 'wrong' ? (
                    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
                      <path d="M2 2L10 10M10 2L2 10" stroke="white" strokeWidth="2" strokeLinecap="round"/>
                    </svg>
                  ) : (
                    <span style={{ fontSize: 11, fontWeight: 700, color: T.textSec }}>{labels[i]}</span>
                  )}
                </div>
                <span style={{ fontSize: 13.5, fontWeight: st !== 'idle' ? 600 : 500, color: s.text, lineHeight: 1.5, flex: 1 }}>
                  {opt.text}
                </span>
              </button>
            );
          })}
        </div>

        {/* Explanation */}
        {revealed && (
          <div style={{
            background: T.surface, border: `1px solid ${T.border}`,
            borderRadius: 13, padding: '12px 14px', marginBottom: 14,
            display: 'flex', gap: 10,
            boxShadow: shadow.sm,
            animation: 'fadeUp 0.3s ease',
          }}>
            <div style={{
              width: 26, height: 26, borderRadius: 8, background: T.indigoLight,
              display: 'flex', alignItems: 'center', justifyContent: 'center', flexShrink: 0, marginTop: 1,
            }}>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none">
                <circle cx="6.5" cy="6.5" r="5.8" stroke={T.indigo} strokeWidth="1.2"/>
                <path d="M6.5 5.5v4M6.5 4v.5" stroke={T.indigo} strokeWidth="1.5" strokeLinecap="round"/>
              </svg>
            </div>
            <div>
              <div style={{ color: T.indigo, fontSize: 10, fontWeight: 800, letterSpacing: 0.5, marginBottom: 3 }}>EXPLANATION</div>
              <p style={{ color: T.textSec, fontSize: 12.5, lineHeight: 1.6 }}>{mcqQuestion.explanation}</p>
            </div>
          </div>
        )}
      </div>

      {/* Next CTA */}
      <div style={{
        padding: '12px 14px 28px', background: T.bg,
        borderTop: `1px solid ${T.border}`,
        opacity: revealed ? 1 : 0,
        transform: revealed ? 'translateY(0)' : 'translateY(10px)',
        transition: 'all 0.28s ease',
      }}>
        <button style={{
          width: '100%', background: `linear-gradient(135deg, ${T.indigo}, #5062B8)`,
          border: 'none', borderRadius: 14, padding: '15px',
          color: '#fff', fontSize: 14, fontWeight: 700,
          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 7,
          boxShadow: shadow.indigo,
        }}>
          Next Question
          <svg width="17" height="17" viewBox="0 0 17 17" fill="none">
            <path d="M4 8.5H13M13 8.5L9 4.5M13 8.5L9 12.5" stroke="white" strokeWidth="1.8" strokeLinecap="round"/>
          </svg>
        </button>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════
function Screen4() {

          <div style={{ color: T.textSec, fontSize: 11, fontWeight: 700, marginBottom: 12, letterSpacing: 0.5, textTransform: 'uppercase' }}>

        {/* WhatsApp share */}
        <button onClick={handleShare} style={{

          </svg>
          Share your score on WhatsApp

      </div>
