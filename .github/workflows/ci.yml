name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Unit tests (Vitest)
        run: npm test

      - name: E2E smoke tests (Playwright)
        # Playwright starts Next.js dev server automatically via webServer in playwright.config.ts.
        # Stub credentials are inlined there — no real secrets needed.
        # --workers=1 avoids port conflicts when the server is cold-starting.
        run: npx playwright test --workers=1
        timeout-minutes: 5
