<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 920" width="1440" height="920" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a73e8"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#188038"/>
    </marker>
    <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9334e6"/>
    </marker>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <style>
      .zone-title { font-size: 13px; font-weight: 700; letter-spacing: 1.2px; }
      .card { fill: #ffffff; stroke: #dadce0; stroke-width: 1; }
      .h { font-size: 15px; font-weight: 600; fill: #202124; }
      .s { font-size: 12px; fill: #5f6368; }
      .tag { font-size: 11px; font-weight: 600; }
      .lbl { font-size: 11.5px; fill: #3c4043; }
      .num { font-size: 12px; font-weight: 700; fill: #ffffff; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1440" height="920" fill="#f8f9fa"/>

  <!-- Title -->
  <text x="40" y="52" font-size="26" font-weight="700" fill="#202124">MCQ Palagu — System Architecture</text>
  <text x="40" y="78" font-size="14" fill="#5f6368">Bilingual (Tamil + English) exam-prep platform · mcqpalagu.in</text>

  <!-- ============ ZONE: Clients ============ -->
  <rect x="40" y="110" width="220" height="520" rx="14" fill="#fef7e0" stroke="#f9ab00" stroke-opacity="0.5"/>
  <text x="60" y="138" class="zone-title" fill="#b06000">CLIENTS</text>

  <g filter="url(#sh)">
    <rect x="60" y="160" width="180" height="78" rx="10" class="card"/>
    <rect x="60" y="270" width="180" height="78" rx="10" class="card"/>
    <rect x="60" y="380" width="180" height="78" rx="10" class="card"/>
  </g>
  <text x="76" y="192" class="h">Students</text>
  <text x="76" y="214" class="s">Mobile-first web · EN / TA</text>
  <text x="76" y="302" class="h">Creators</text>
  <text x="76" y="324" class="s">Teachers · study buddies</text>
  <text x="76" y="412" class="h">Admin</text>
  <text x="76" y="434" class="s">Moderation tools</text>

  <!-- ============ ZONE: Vercel ============ -->
  <rect x="320" y="110" width="470" height="520" rx="14" fill="#e8f0fe" stroke="#1a73e8" stroke-opacity="0.45"/>
  <text x="340" y="138" class="zone-title" fill="#1967d2">VERCEL · EDGE + APP</text>

  <g filter="url(#sh)">
    <rect x="340" y="160" width="430" height="64" rx="10" class="card"/>
    <rect x="340" y="244" width="430" height="120" rx="10" class="card"/>
    <rect x="340" y="384" width="430" height="226" rx="10" class="card"/>
  </g>
  <!-- Middleware -->
  <text x="358" y="188" class="h">Edge middleware</text>
  <text x="358" y="208" class="s">Auth gate for admin + moderation routes · fail-closed</text>
  <!-- Pages -->
  <text x="358" y="272" class="h">Next.js 15 App Router · React 19 · TypeScript</text>
  <rect x="358" y="288" width="196" height="58" rx="8" fill="#f1f3f4"/>
  <text x="370" y="311" class="tag" fill="#1967d2">SERVER-RENDERED</text>
  <text x="370" y="331" class="s">SEO study pages · CA archive</text>
  <rect x="566" y="288" width="188" height="58" rx="8" fill="#f1f3f4"/>
  <text x="578" y="311" class="tag" fill="#1967d2">INTERACTIVE</text>
  <text x="578" y="331" class="s">Practice · mock tests · scores</text>
  <!-- API -->
  <text x="358" y="412" class="h">API routes (server-only keys)</text>
  <rect x="358" y="428" width="396" height="38" rx="8" fill="#f1f3f4"/>
  <text x="370" y="452" class="lbl"><tspan font-weight="600">/api/creator/extract</tspan>  — token + ownership check → Gemini</text>
  <rect x="358" y="474" width="396" height="38" rx="8" fill="#f1f3f4"/>
  <text x="370" y="498" class="lbl"><tspan font-weight="600">/api/mock/questions</tspan>  — 200-question PYQ mocks</text>
  <rect x="358" y="520" width="396" height="38" rx="8" fill="#f1f3f4"/>
  <text x="370" y="544" class="lbl"><tspan font-weight="600">/api/cron/current-affairs</tspan>  — bearer-secret trigger</text>
  <rect x="358" y="566" width="396" height="30" rx="8" fill="#f1f3f4"/>
  <text x="370" y="586" class="lbl"><tspan font-weight="600">/api/admin/*</tspan>  — httpOnly session</text>

  <!-- ============ ZONE: Supabase ============ -->
  <rect x="850" y="110" width="290" height="520" rx="14" fill="#e6f4ea" stroke="#188038" stroke-opacity="0.45"/>
  <text x="870" y="138" class="zone-title" fill="#137333">SUPABASE</text>

  <g filter="url(#sh)">
    <rect x="870" y="160" width="250" height="78" rx="10" class="card"/>
    <rect x="870" y="258" width="250" height="352" rx="10" class="card"/>
  </g>
  <text x="888" y="192" class="h">Auth</text>
  <text x="888" y="214" class="s">Google OAuth · JWT sessions</text>

  <text x="888" y="290" class="h">PostgreSQL</text>
  <text x="888" y="310" class="s">Row Level Security on all tables</text>
  <g class="lbl">
    <rect x="888" y="326" width="214" height="28" rx="6" fill="#f1f3f4"/><text x="900" y="345">questions · 10,000+</text>
    <rect x="888" y="360" width="214" height="28" rx="6" fill="#f1f3f4"/><text x="900" y="379">current_affairs · EN + TA</text>
    <rect x="888" y="394" width="214" height="28" rx="6" fill="#f1f3f4"/><text x="900" y="413">creators · packs</text>
    <rect x="888" y="428" width="214" height="28" rx="6" fill="#f1f3f4"/><text x="900" y="447">pack_ratings</text>
    <rect x="888" y="462" width="214" height="28" rx="6" fill="#f1f3f4"/><text x="900" y="481">users</text>
  </g>
  <text x="888" y="522" class="tag" fill="#137333">DATABASE-LEVEL GUARANTEES</text>
  <text x="888" y="542" class="s">• Trigger creates profile on sign-up</text>
  <text x="888" y="560" class="s">• RLS enabled on every table</text>
  <text x="888" y="578" class="s">• Fingerprint de-dup on insert</text>

  <!-- ============ ZONE: AI ============ -->
  <rect x="1200" y="110" width="200" height="300" rx="14" fill="#f3e8fd" stroke="#9334e6" stroke-opacity="0.45"/>
  <text x="1220" y="138" class="zone-title" fill="#8430ce">GENERATIVE AI</text>
  <g filter="url(#sh)"><rect x="1220" y="160" width="160" height="230" rx="10" class="card"/></g>
  <text x="1236" y="192" class="h">Google Gemini</text>
  <text x="1236" y="212" class="s">2.5 Flash · fallbacks</text>
  <text x="1236" y="248" class="s">• PDF / image extraction</text>
  <text x="1236" y="270" class="s">• MCQ generation</text>
  <text x="1236" y="292" class="s">• EN → TA translation</text>
  <text x="1236" y="314" class="s">• Output validation</text>
  <text x="1236" y="340" class="tag" fill="#8430ce">GUARDED PROMPTS</text>
  <text x="1236" y="360" class="s">Injection guards</text>
  <text x="1236" y="378" class="s">Profanity filters</text>

  <!-- ============ ZONE: Automation (bottom) ============ -->
  <rect x="320" y="670" width="820" height="190" rx="14" fill="#fce8e6" stroke="#d93025" stroke-opacity="0.4"/>
  <text x="340" y="698" class="zone-title" fill="#c5221f">GITHUB ACTIONS · AUTOMATION</text>
  <g filter="url(#sh)">
    <rect x="340" y="716" width="370" height="124" rx="10" class="card"/>
    <rect x="730" y="716" width="390" height="124" rx="10" class="card"/>
  </g>
  <text x="358" y="746" class="h">CI on every push + PR</text>
  <text x="358" y="770" class="s">Vitest · 248 unit tests</text>
  <text x="358" y="790" class="s">Playwright smoke tests</text>
  <text x="358" y="816" class="s">main branch auto-deploys to Vercel</text>

  <text x="748" y="746" class="h">Nightly current-affairs job · 2 AM IST</text>
  <text x="748" y="770" class="s">Scrape PIB → generate 30 MCQs → validate</text>
  <text x="748" y="790" class="s">(subject whitelist, TN focus, 5-day de-dup)</text>
  <text x="748" y="816" class="s">→ translate → upsert ~60 rows/day (EN + TA)</text>

  <!-- External: PIB -->
  <g filter="url(#sh)"><rect x="60" y="740" width="180" height="76" rx="10" class="card"/></g>
  <text x="76" y="772" class="h">PIB.gov.in</text>
  <text x="76" y="794" class="s">Govt press releases</text>

  <!-- Observability -->
  <rect x="1200" y="440" width="200" height="190" rx="14" fill="#f1f3f4" stroke="#80868b" stroke-opacity="0.45"/>
  <text x="1220" y="468" class="zone-title" fill="#5f6368">OBSERVABILITY</text>
  <g filter="url(#sh)"><rect x="1220" y="486" width="160" height="124" rx="10" class="card"/></g>
  <text x="1236" y="516" class="h">Analytics</text>
  <text x="1236" y="538" class="s">Vercel Web Analytics</text>
  <text x="1236" y="558" class="s">Google Analytics</text>
  <text x="1236" y="578" class="s">Search Console</text>
  
  <!-- ============ FLOWS ============ -->
  <!-- 1 clients -> app -->
  <path d="M240,199 L338,199" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M240,309 L290,309 L290,316 L338,316" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <path d="M240,419 L338,419" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="289" cy="199" r="11" fill="#334155"/><text x="289" y="203.5" class="num" text-anchor="middle">1</text>

  <!-- 2 app <-> auth -->
  <path d="M772,199 L868,199" stroke="#188038" stroke-width="2" fill="none" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <circle cx="820" cy="199" r="11" fill="#188038"/><text x="820" y="203.5" class="num" text-anchor="middle">2</text>

  <!-- 3 pages <-> postgres -->
  <path d="M772,316 L868,316" stroke="#188038" stroke-width="2" fill="none" marker-start="url(#arrG)" marker-end="url(#arrG)"/>
  <circle cx="820" cy="316" r="11" fill="#188038"/><text x="820" y="320.5" class="num" text-anchor="middle">3</text>

  <!-- 4 api -> postgres -->
  <path d="M772,470 L868,470" stroke="#188038" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <circle cx="820" cy="470" r="11" fill="#188038"/><text x="820" y="474.5" class="num" text-anchor="middle">4</text>

  <!-- 5 creator API -> Gemini (over the top) -->
  <path d="M754,447 L780,447 L780,96 L1365,96 L1365,158" stroke="#9334e6" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <circle cx="1040" cy="96" r="11" fill="#9334e6"/><text x="1040" y="100.5" class="num" text-anchor="middle">5</text>

  <!-- 6 PIB -> cron -->
  <path d="M240,778 L290,778 L290,852 L925,852 L925,843" stroke="#c5221f" stroke-width="2" fill="none" marker-end="url(#arr)"/>
  <circle cx="290" cy="815" r="11" fill="#c5221f"/><text x="290" y="819.5" class="num" text-anchor="middle">6</text>

  <!-- 7 cron -> Gemini -->
  <path d="M1120,760 L1420,760 L1420,280 L1383,280" stroke="#9334e6" stroke-width="2" fill="none" marker-end="url(#arrP)"/>
  <circle cx="1420" cy="700" r="11" fill="#9334e6"/><text x="1420" y="704.5" class="num" text-anchor="middle">7</text>

  <!-- 8 cron -> postgres -->
  <path d="M1000,716 L1000,612" stroke="#188038" stroke-width="2" fill="none" marker-end="url(#arrG)"/>
  <circle cx="1000" cy="660" r="11" fill="#188038"/><text x="1000" y="664.5" class="num" text-anchor="middle">8</text>

  <!-- 9 CI -> Vercel deploy -->
  <path d="M525,716 L525,612" stroke="#1a73e8" stroke-width="2" fill="none" marker-end="url(#arrB)" stroke-dasharray="6 4"/>
  <circle cx="525" cy="650" r="11" fill="#1a73e8"/><text x="525" y="654.5" class="num" text-anchor="middle">9</text>

  <!-- Legend -->
  <g class="lbl" font-size="10.5" fill="#3c4043">
    <text x="40" y="896"><tspan font-weight="700" fill="#5f6368">FLOWS  </tspan>1 Request · 2 Sign-in · 3 Read (RLS) · 4 Write (ownership-checked) · 5 Creator extraction · 6 News ingest · 7 Generate + translate · 8 Upsert · 9 Test + deploy from main</text>
  </g>
</svg>
